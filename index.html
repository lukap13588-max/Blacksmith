<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Blacksmith Simulator 3D · Alpha 0.3.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14100e;color:#fff;font-family:system-ui,-apple-system,Arial;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;pointer-events:none;text-shadow:0 2px 5px #000}h1{font-size:17px;letter-spacing:.6px;margin:2px 0 8px;color:#ffe0aa}#stats{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #a17b4c80;background:#1e1916dc;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}#order{margin-top:7px;font-size:12px;color:#fbd5a1;background:#1e1916db;border-radius:8px;padding:7px 9px;display:inline-block}#toast{position:fixed;top:155px;left:50%;transform:translateX(-50%);max-width:90%;background:#201912ed;border:1px solid #bb8648;border-radius:10px;padding:10px 13px;font-size:13px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 9px);left:9px;right:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{touch-action:manipulation;border:1px solid #b48652;border-radius:12px;background:linear-gradient(#60402b,#302015);color:#fff;padding:12px 3px;font-size:12px;font-weight:800;min-height:58px;box-shadow:0 3px 10px #000a}button:active{transform:scale(.97);filter:brightness(1.2)}button:disabled{opacity:.45}#hit{background:linear-gradient(#b26a29,#563019);border-color:#f2b46a}#progress{margin-top:7px;width:min(330px,90vw);height:8px;border:1px solid #9e7044;background:#201713;border-radius:8px;overflow:hidden}#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#e75b25,#ffd26c);transition:width .2s}#recipe{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 126px);background:#211a15e8;border:1px solid #906a48;border-radius:10px;padding:8px;font-size:12px;max-width:150px}#recipe select{background:#38271e;color:white;border:1px solid #a57749;border-radius:6px;padding:6px;width:100%;margin-top:6px}#instruction{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 155px);background:#1a1411d9;border-left:3px solid #e39c53;padding:8px 10px;font-size:12px;max-width:240px;border-radius:5px}#sell{grid-column:1/3;background:linear-gradient(#49603c,#283722);border-color:#91b87b}#upgrade{background:linear-gradient(#525061,#282633);border-color:#9991be}#guide{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 150px);left:10px;right:10px;text-align:center;font-size:11px;color:#fff9;text-shadow:0 1px 5px black;pointer-events:none}#error{display:none;position:fixed;inset:20% 7%;background:#3a1717;padding:20px;border-radius:12px;z-index:9}</style></head><body>
<div id="hud"><h1>⚒ BLACKSMITH SIMULATOR 3D <span style="font-size:10px;color:#d4a76e">ALPHA 0.3.2</span></h1><div id="stats"><div class="pill" id="temp">🌡 20 °C</div><div class="pill" id="hits">⚒ 0 / 8</div><div class="pill" id="coins">🪙 0</div><div class="pill" id="quality">⭐ Qualität: –</div></div><div id="order">📜 Auftrag: 1 Eisenhaken schmieden<div id="progress"><div id="progressFill"></div></div></div>
<div id="toast"></div><div id="recipe">📋 <b>Werkstück</b><select id="product"><option value="hook">Eisenhaken</option><option value="shoe">Hufeisen</option><option value="blade">Kleine Klinge</option></select></div><div id="instruction">🔥 Erhitze zuerst dein Werkstück auf mindestens 500 °C.</div><div id="guide">Wischen: Kamera · Zwei Finger: Zoom · Schmieden: wiederholt tippen</div><div id="panel"><button id="heat">🔥<br>Erhitzen</button><button id="hit">⚒️<br>Schmieden</button><button id="cool">💧<br>Abkühlen</button><button id="sell">🪙 Produkt verkaufen</button><button id="upgrade">⬆️ Esse (50 🪙)</button></div><div id="error"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x181b20);scene.fog=new THREE.Fog(0x181b20,11,23);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,70),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);
const material=(c,metal=0,rough=.8)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});const rock=material(0x5b5550),mortar=material(0x282625),timber=material(0x68422b),iron=material(0x92989b,.8,.3),dark=material(0x2c3033,.65),coal=material(0x17120f),bronze=material(0xa27642,.6);
function mesh(geo,mat,parent=scene,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}function block(w,h,d,mat,x,y,z,parent=scene){return mesh(new THREE.BoxGeometry(w,h,d),mat,parent,x,y,z)}function cylinder(r1,r2,h,mat,x,y,z,parent=scene){return mesh(new THREE.CylinderGeometry(r1,r2,h,12),mat,parent,x,y,z)}
scene.add(new THREE.HemisphereLight(0x9db4dc,0x4b2510,1.45));const daylight=new THREE.DirectionalLight(0xffe2ba,2.4);daylight.position.set(3,7,4);daylight.castShadow=true;daylight.shadow.mapSize.set(1024,1024);daylight.shadow.camera.left=-9;daylight.shadow.camera.right=9;daylight.shadow.camera.top=9;daylight.shadow.camera.bottom=-9;scene.add(daylight);const firelight=new THREE.PointLight(0xff7022,30,8);firelight.position.set(-2,2.2,-1.8);scene.add(firelight);
block(11,.22,11,rock,0,-.14,0);for(let x=-5;x<6;x++)for(let z=-5;z<6;z++){const tile=block(.97,.03,.97,material((x+z)%3===0?0x50463e:0x66574d),x,.005,z);tile.castShadow=false}
// Back and side walls with stone courses
for(let y=0;y<5;y++)for(let x=0;x<14;x++){block(.78,.64,.48,material((x+y)%3===0?0x61574c:0x484441),-5.15+x*.79,.34+y*.65,-4.65)}
for(let y=0;y<5;y++)for(let z=0;z<10;z++){block(.5,.64,.88,material((z+y)%3===0?0x61574c:0x4b4742),-5.5,.34+y*.65,-4.3+z*.89)}
for(let x of [-4.9,-1.9,1.2,4.2])block(.23,3.5,.28,timber,x,1.75,-4.25);block(10.4,.32,.32,timber,0,3.4,-4.25);
// Forge, coal and chimney
block(2.55,1.03,1.7,rock,-2.35,.55,-1.9);block(2.78,.2,1.93,material(0x807469),-2.35,1.1,-1.9);block(1.85,.12,1.1,coal,-2.35,1.24,-1.9);block(1.1,1.6,.4,rock,-2.35,2.05,-2.67);block(1.75,.18,.75,rock,-2.35,2.9,-2.48);
const flames=[];for(let i=0;i<17;i++){const m=new THREE.MeshBasicMaterial({color:i%3===0?0xffc44a:0xff6315,transparent:true,opacity:.78,depthWrite:false});const f=mesh(new THREE.ConeGeometry(.09+Math.random()*.12,.35+Math.random()*.55,5),m,scene,-3.07+Math.random()*1.45,1.53,-2.25+Math.random()*.7);flames.push({f,offset:Math.random()*8})}
// Anvil and stump
cylinder(.7,.8,.75,timber,0,.4,.05);block(1.4,.27,.72,dark,0,.89,.05);block(1.12,.2,.94,iron,0,1.13,.05);const horn=mesh(new THREE.ConeGeometry(.27,.9,12),iron,scene,1.02,1.1,.05);horn.rotation.z=-Math.PI/2;
// Quenching trough
block(1.65,.8,1.12,timber,2.3,.42,-1.7);const water=block(1.42,.025,.93,new THREE.MeshStandardMaterial({color:0x388fa4,metalness:.3,roughness:.16,transparent:true,opacity:.83}),2.3,.83,-1.7);
// Shelves and tools
for(let y of [1.25,2.2]){block(2.3,.13,.58,timber,2.8,y,-4.06);for(let i=0;i<3;i++){cylinder(.1,.13,.36,bronze,2.1+i*.55,y+.23,-4.05)}}
for(let i=0;i<4;i++){const rod=cylinder(.035,.035,.9,iron,-4.9+i*.22,1.65,-4.07);rod.rotation.z=.22+i*.13}block(1.8,.16,.8,timber,2.4,.86,1.5);for(let x of [1.65,3.15])block(.13,.8,.13,timber,x,.42,1.5);
// Forgeable steel, position varies between stations
const steelMat=new THREE.MeshStandardMaterial({color:0x7b858b,metalness:.88,roughness:.31,emissive:0xff3e00,emissiveIntensity:0});const steel=block(.85,.16,.25,steelMat,0,1.34,.05);const hammer=new THREE.Group();hammer.position.set(-.65,1.7,.18);scene.add(hammer);const shaft=cylinder(.055,.07,1.15,timber,0,.48,0,hammer);const head=block(.62,.25,.28,iron,0,1.04,0,hammer);hammer.rotation.z=-.95;
const sparks=[];for(let i=0;i<45;i++){const p=mesh(new THREE.SphereGeometry(.025,5,4),new THREE.MeshBasicMaterial({color:i%2?0xffd66c:0xff6b18}));p.visible=false;sparks.push({p,v:new THREE.Vector3(),life:0})}const steam=[];for(let i=0;i<18;i++){const p=mesh(new THREE.SphereGeometry(.07+Math.random()*.09,6,5),new THREE.MeshBasicMaterial({color:0xcbd5d7,transparent:true,opacity:.0,depthWrite:false}));p.visible=false;steam.push({p,life:0,v:0})}

// Workshop details: window, work lights, tool rack, floor debris and forge chimney
const glowWindow=new THREE.MeshBasicMaterial({color:0xffc581});
block(1.55,1.1,.08,material(0x30251f),1.1,2.18,-4.32);
block(1.3,.85,.09,glowWindow,1.1,2.18,-4.26);
block(.12,1.12,.14,timber,1.1,2.18,-4.15);block(1.55,.11,.14,timber,1.1,2.18,-4.15);
const ambientForge=new THREE.PointLight(0xffaa51,3,5);ambientForge.position.set(.5,2.5,0);scene.add(ambientForge);
for(let i=0;i<32;i++){const x=(Math.sin(i*13.37)*4.3),z=(Math.cos(i*8.71)*3.6);if(Math.abs(x)<1.2&&Math.abs(z)<1.2)continue;const chip=block(.07+(i%4)*.035,.015,.08,material(i%2?0x322e2b:0x84705a),x,.035,z);chip.rotation.y=i*.73}
for(let i=0;i<5;i++){const bar=block(.09,.09,.65,iron,2+i*.23,1.03,1.5);bar.rotation.y=.3+i*.11}
// Shape morphing based on selected product and hammer blows
const hookCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.38,0,0),new THREE.Vector3(-.12,0,0),new THREE.Vector3(.2,0,0),new THREE.Vector3(.38,0,.14),new THREE.Vector3(.26,0,.35),new THREE.Vector3(.04,0,.34)]);
const shoeCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.38,0,.2),new THREE.Vector3(-.36,0,-.13),new THREE.Vector3(-.12,0,-.34),new THREE.Vector3(.17,0,-.34),new THREE.Vector3(.39,0,-.1),new THREE.Vector3(.38,0,.2)]);
function shapeSteel(){let geometry;if(selected==='hook'&&hits>=target){geometry=new THREE.TubeGeometry(hookCurve,26,.075,8,false)}else if(selected==='shoe'&&hits>=target){geometry=new THREE.TubeGeometry(shoeCurve,30,.09,8,false)}else if(selected==='blade'&&hits>=target){geometry=new THREE.BoxGeometry(1.05,.065,.32)}else{geometry=new THREE.BoxGeometry(.65+hits*.035,Math.max(.07,.16-hits*.005),.22+hits*.004)}steel.geometry.dispose();steel.geometry=geometry;steel.scale.set(1,1,1)}

const saveKey='blacksmith-alpha03';let saved={};try{saved=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch{}let coins=Number(saved.coins)||0,level=Number(saved.level)||0,orders=Number(saved.orders)||0,temp=20,hits=0,quality=100,stage='raw',heatActive=false,hammerTime=0,impact=false,steamTime=0,ready=false;const recipes={hook:{name:'Eisenhaken',hits:8,price:22},shoe:{name:'Hufeisen',hits:11,price:34},blade:{name:'Kleine Klinge',hits:15,price:55}};let selected='hook',target=8;
function toast(message){$('toast').textContent=message;$('toast').style.opacity='1';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity='0',2100)}function save(){try{localStorage.setItem(saveKey,JSON.stringify({coins,level,orders}))}catch{}}
function refresh(){const glow=Math.max(0,(temp-320)/800);steelMat.emissiveIntensity=glow*2.5;steelMat.color.setHex(temp>950?0xffd280:temp>700?0xff8a44:temp>450?0xba4a30:0x7b858b);$('temp').textContent=`🌡 ${Math.round(temp)} °C`;$('hits').textContent=`⚒ ${hits} / ${target}`;$('coins').textContent=`🪙 ${coins}`;$('quality').textContent=`⭐ Qualität: ${hits?Math.round(quality)+'%':'–'}`;$('order').firstChild.textContent=`📜 Auftrag ${orders+1}: ${recipes[selected].name} · ${ready?'Fertig – verkaufen!':hits>=target?'Jetzt abschrecken':'Schmieden'}`;$('progressFill').style.width=(hits/target*100)+'%';$('instruction').textContent=ready?'🪙 Fertig! Verkaufe dein Produkt.':hits>=target?'💧 Form fertig! Jetzt abschrecken.':temp<500?'🔥 Metall zu kalt – zuerst erhitzen.':stage==='heating'?'🔥 Metall wird erhitzt. Tippe auf Schmieden.':`⚒️ ${target-hits} Schläge bis zur fertigen Form.`;$('sell').disabled=!ready;$('upgrade').textContent=`⬆️ Esse (${50+level*40} 🪙) · St. ${level+1}`}
function burst(){for(const s of sparks){s.life=.25+Math.random()*.5;s.p.visible=true;s.p.position.set((Math.random()-.5)*.5,1.35,(Math.random()-.5)*.28);s.v.set((Math.random()-.5)*3.6,Math.random()*2.8,(Math.random()-.5)*3.6)}}
function doHeat(){if(ready){toast('Verkaufe zuerst dein fertiges Produkt.');return}heatActive=true;stage='heating';steel.position.set(-2.35,1.36,-1.9);toast('Das Werkstück liegt jetzt in der Esse.');refresh()}
function doHit(){if(ready){toast('Produkt zuerst verkaufen.');return}if(hammerTime>0)return;if(temp<500){toast('Zu kalt! Erhitze das Metall auf mindestens 500 °C.');return}heatActive=false;stage='forging';steel.position.set(0,1.34,.05);hammerTime=.56;impact=false}
function doCool(){if(ready){toast('Produkt ist bereits fertig.');return}if(hits<target){toast(`Noch ${target-hits} Hammerschläge nötig.`);return}heatActive=false;stage='quenched';steel.position.set(2.3,.93,-1.7);steamTime=1.7;temp=20;ready=true;refresh();toast('Zisch! Fertig geschmiedet und abgeschreckt.')}
function doSell(){if(!ready)return;const reward=Math.max(8,Math.round(recipes[selected].price+quality*.35));coins+=reward;orders++;save();toast(`Verkauft! +${reward} Münzen`);hits=0;quality=100;ready=false;temp=20;stage='raw';steel.position.set(0,1.34,.05);shapeSteel();refresh()}
function doUpgrade(){const cost=50+level*40;if(coins<cost){toast(`Dir fehlen ${cost-coins} Münzen.`);return}coins-=cost;level++;save();refresh();toast('Esse verbessert! Metall erhitzt sich schneller.')}
$('product').onchange=e=>{if(hits||ready){e.target.value=selected;toast('Werkstück zuerst fertigstellen und verkaufen.');return}selected=e.target.value;target=recipes[selected].hits;shapeSteel();refresh()};$('heat').onclick=doHeat;$('hit').onclick=doHit;$('cool').onclick=doCool;$('sell').onclick=doSell;$('upgrade').onclick=doUpgrade;refresh();
let az=.52,el=.47,dist=7.2,pointers=new Map(),lastPinch=0;function placeCamera(){el=Math.max(.12,Math.min(1.23,el));dist=Math.max(3.6,Math.min(11,dist));camera.position.set(Math.sin(az)*Math.cos(el)*dist,1.2+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,1.2,-.6)}placeCamera();const c=renderer.domElement;c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){az-=(e.clientX-old.x)*.007;el+=(e.clientY-old.y)*.005}else{const a=[...pointers.values()],gap=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)dist*=lastPinch/gap;lastPinch=gap}placeCamera()});const end=e=>{pointers.delete(e.pointerId);lastPinch=0};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
shapeSteel();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;for(const {f,offset} of flames){f.scale.y=.8+Math.sin(t*9+offset)*.25;f.position.y=1.48+Math.sin(t*7+offset)*.08}firelight.intensity=26+Math.sin(t*11)*5;water.position.y=.83+Math.sin(t*2)*.012;if(heatActive){temp=Math.min(1150,temp+dt*(125+level*65));if(temp>=1150)heatActive=false;refresh()}else if(!ready&&temp>20){temp=Math.max(20,temp-dt*(stage==='forging'?15:8));refresh()}
if(hammerTime>0){hammerTime=Math.max(0,hammerTime-dt);const phase=1-hammerTime/.56;hammer.rotation.z=-.95+Math.sin(phase*Math.PI)*1.45;if(!impact&&phase>=.48){impact=true;hits++;quality=Math.max(30,quality-(temp<650?9:temp>1050?5:1));temp=Math.max(20,temp-43);shapeSteel();burst();refresh();if(hits===target)toast('Form fertig! Jetzt abschrecken.');else if(temp<500)toast('Werkstück abgekühlt – erneut erhitzen!')}}else hammer.rotation.z=-.95;
for(const s of sparks){if(s.life>0){s.life-=dt;s.p.position.addScaledVector(s.v,dt);s.v.y-=dt*6;s.p.visible=s.life>0}else s.p.visible=false}if(steamTime>0){steamTime-=dt;for(let i=0;i<steam.length;i++){const s=steam[i];if(s.life<=0){s.life=.45+Math.random()*.8;s.p.position.set(2.3+(Math.random()-.5)*.8,.94,-1.7+(Math.random()-.5)*.6);s.v=.4+Math.random()*.8;s.p.visible=true}s.life-=dt;s.p.position.y+=s.v*dt;s.p.material.opacity=Math.max(0,Math.min(.35,s.life*.4))}}else for(const s of steam){s.life=0;s.p.visible=false}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
